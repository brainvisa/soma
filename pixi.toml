[workspace]
name = "soma"
channels = ["conda-forge", "https://brainvisa.info/neuro-forge", "file:///home/yann/dev/brainvisa-cmake/channel"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "*"

# Build tools
cmake = ">=3.28"
clang = "*"
