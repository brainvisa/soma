doxygen = "*"
git = "*"

# Core dependencies for soma-io
"sigcpp-2.0" = "*"
libblitz = "*"
libboost-devel = "*"
numpy = "<2"
pyyaml = "*"
libminc = "*"
openjpeg = "*"
libxml2-devel = "*"
zlib = "*"
libtiff = "*"
jasper = "*"
dcmtk = ">=3.7"
soma-openslide = "*"
pyqtwebkit = "*"
qtconsole = "*"
pyqt = "*"
pyqtwebengine = "*"

graphviz = "*"
sphinx = "*"
gitpython = "*"
python-dateutil = "*"
python-build = "*"
hdf5 = "<2"
brainvisa-cmake = "*"
